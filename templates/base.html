<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Finance Advisor Bot helps you plan budgets, track spending, and reach financial goals faster."
    />
    <title>{% block title %}Piyu | Finance Advisor Bot{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    {% block content %}{% endblock %}
    <script>
      (() => {
        const savedTheme = localStorage.getItem('piyu-theme');
        const preferredTheme = savedTheme || 'light';
        document.body.setAttribute('data-theme', preferredTheme);

        const syncToggle = () => {
          const toggle = document.querySelector('.theme-toggle');
          if (!toggle) return;

          const isDark = document.body.dataset.theme === 'dark';
          toggle.setAttribute('aria-pressed', String(isDark));
          toggle.classList.toggle('is-dark', isDark);

          const label = toggle.querySelector('.theme-toggle-label');
          if (label) {
            label.textContent = isDark ? 'Dark' : 'Light';
          }
        };

        document.addEventListener('DOMContentLoaded', () => {
          syncToggle();

          const toggle = document.querySelector('.theme-toggle');
          if (!toggle) return;

          toggle.addEventListener('click', () => {
            const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', nextTheme);
            localStorage.setItem('piyu-theme', nextTheme);
            syncToggle();
          });
        });
      })();
    </script>
  </body>
</html>
